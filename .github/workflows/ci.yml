name: TSUGU CI

on:
  push:
    branches:
      - main
      - integration/tidywindow-baseline
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsugu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300

      - name: Restore
        run: dotnet restore TSUGU.slnx --locked-mode

      - name: Build
        run: dotnet build TSUGU.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/TidyWindow.Tests/TidyWindow.Tests.csproj --configuration Release --no-build
