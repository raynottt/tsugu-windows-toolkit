name: One-time TSUGU refactor

on:
  push:
    branches: [main]
    paths:
      - scripts/refactor-tsugu.ps1
      - .github/workflows/refactor-tsugu.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tsugu-one-time-refactor
  cancel-in-progress: false

jobs:
  refactor:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300
      - name: Apply refactor
        shell: pwsh
        run: ./scripts/refactor-tsugu.ps1
      - name: Commit changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make TSUGU independent and remove Debloat"
          git push origin HEAD:main
      - name: Restore
        run: dotnet restore TSUGU.slnx --locked-mode
      - name: Build
        run: dotnet build TSUGU.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/TSUGU.Tests/TSUGU.Tests.csproj --configuration Release --no-build
